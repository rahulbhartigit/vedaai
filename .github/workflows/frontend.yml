name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'

jobs:
  # ── TypeScript check (quality gate before Vercel deploys) ────────────────────
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run TypeScript check
        run: npx tsc --noEmit
        working-directory: frontend

  # ── Next.js build check ───────────────────────────────────────────────────────
  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Next.js app
        run: npm run build
        working-directory: frontend
        env:
          # Use placeholder — real value set in Vercel dashboard
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL || 'http://localhost:5000' }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL || 'ws://localhost:5000/ws' }}

# ── Note ──────────────────────────────────────────────────────────────────────
# Vercel auto-deploys when this workflow passes:
#   1. Connect this GitHub repo to Vercel (vercel.com/import)
#   2. Set Root Directory → frontend/
#   3. Set environment variables in Vercel dashboard:
#      NEXT_PUBLIC_API_URL = https://your-ec2-ip-or-domain:5000
#      NEXT_PUBLIC_WS_URL  = wss://your-ec2-ip-or-domain:5000/ws
#   4. Vercel will auto-deploy on every push to main once CI passes
